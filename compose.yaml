services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulseml
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d pulseml"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/pulseml
      PULSEML_API_KEY: ${PULSEML_API_KEY:?Set PULSEML_API_KEY in .env}
      PULSEML_MODEL_PATH: /app/models/astrolens.joblib
      PULSEML_REFERENCE_PATH: /app/data/kepler_reference.npz
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    profiles: ["tools"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/pulseml
      PULSEML_DB_PATH: /app/pulseml.db
      PULSEML_MODEL_PATH: /app/models/astrolens.joblib
      PULSEML_REFERENCE_PATH: /app/data/kepler_reference.npz
    volumes:
      - ./pulseml.db:/app/pulseml.db:ro
      - ./models:/app/models:ro
    command: ["python", "scripts/migrate_sqlite_to_postgres.py"]

volumes:
  postgres_data:
